# Optional: autostart the keep-alive loop at boot (upstart).
#
#   mntroot rw
#   cp awing.conf /etc/init/awing.conf
#   mntroot ro
#
# Kindle firmware uses upstart. Check what jobs exist first:
#   ls /etc/init | grep -iE 'net|wifi|wpa'
# and adjust the "start on" line to whatever is there. If the Kindle has no
# matching event, drop this file and start the loop from KUAL instead.

start on (started network or started wpa_supplicant)
stop on (stopping network or stopping wpa_supplicant)
respawn
respawn limit 10 60
exec /bin/sh /mnt/us/extensions/awing/autologin.sh --loop
